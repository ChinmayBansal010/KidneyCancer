name: Build Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag or release tag to attach built assets to
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

      - name: Attach distributions to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event.inputs.tag }}
